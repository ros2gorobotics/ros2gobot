ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ---- Wheel Odometry ----
    odom0: odom/unfiltered
    odom0_config:
      [false, false, false,   # ปิด X, Y
       false, false, false,   # ปิดมุม Yaw ทุกชนิด
       true,  false, false,   # **รับแค่ Vx (ความเร็วเดินหน้า/ถอยหลัง) เท่านั้น**
       false, false, false,   # **ปิด Vyaw เด็ดขาด**
       false, false, false]
    odom0_relative: false

    # ---- Laser Odometry (rf2o) ----
    odom1: /odom_rf2o
    odom1_config:
      [true,  true,  false,   # Lidar ยืนยันว่า X, Y ไม่เปลี่ยน
       false, false, true,    # Lidar ยืนยันว่ามุม Yaw ไม่เปลี่ยน (ถ้าล้อหมุนฟรี Lidar จะรั้งหุ่นไว้)
       false, false, false,   # ปิดความเร็วจาก Lidar ป้องกันการแกว่ง
       false, false, false,
       false, false, false]
    odom1_relative: false

    # ---- IMU ----
    imu0: /imu/data
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,    # IMU ยืนยันความเร็วหมุน (Vyaw)
       false, false, false]
    imu0_remove_gravitational_acceleration: true