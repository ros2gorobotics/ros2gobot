ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ---- Wheel Odometry ----
    odom0: odom/unfiltered
    odom0_config:
      [false,  false,  false,   # x, y
       false, false, false,    # yaw
       true,  true, false,   # vx
       false, false, true,    # vyaw
       false, false, false]   # accel
    odom0_relative: true
    #odom0_twist_rejection_threshold: 0.2

    # ---- IMU ----
    imu0: /imu/data
    imu0_config:
      [false, false, false,
       false, false, true,    # yaw
       false, false, false,
       false, false, true,    # yaw rate
       false, false, false]

    imu0_remove_gravitational_acceleration: true
